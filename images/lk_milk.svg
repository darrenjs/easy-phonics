<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" width="1024" height="1536">
<defs>
  <linearGradient id="glass" x1="0" x2="1">
    <stop offset="0" stop-color="#d9f3ff"/>
    <stop offset=".18" stop-color="#f7fdff"/>
    <stop offset=".55" stop-color="#d7edf7"/>
    <stop offset=".82" stop-color="#eefaff"/>
    <stop offset="1" stop-color="#b9dce9"/>
  </linearGradient>
  <linearGradient id="milk" x1="0" x2="1">
    <stop offset="0" stop-color="#fffef9"/>
    <stop offset=".5" stop-color="#fffdf5"/>
    <stop offset="1" stop-color="#f2efe3"/>
  </linearGradient>
  <linearGradient id="cap" x1="0" x2="1">
    <stop offset="0" stop-color="#158dd4"/>
    <stop offset=".5" stop-color="#159fe8"/>
    <stop offset="1" stop-color="#0874c3"/>
  </linearGradient>
  <linearGradient id="capTop" x1="0" x2="1">
    <stop offset="0" stop-color="#1599df"/>
    <stop offset=".55" stop-color="#159ee8"/>
    <stop offset="1" stop-color="#087bc9"/>
  </linearGradient>
  <linearGradient id="rim" x1="0" x2="1">
    <stop offset="0" stop-color="#b8e4f2"/>
    <stop offset=".5" stop-color="#e9faff"/>
    <stop offset="1" stop-color="#9dcbd9"/>
  </linearGradient>
</defs>

