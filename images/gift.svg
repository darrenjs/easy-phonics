<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
<defs>
  <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff6f8f"/>
    <stop offset="1" stop-color="#e83f68"/>
  </linearGradient>
  <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff89a3"/>
    <stop offset="1" stop-color="#ef5278"/>
  </linearGradient>
  <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffd84d"/>
    <stop offset="1" stop-color="#f4a900"/>
  </linearGradient>
</defs>

<!-- box -->
<path d="M170 330 L630 330 L630 650 Q630 675 605 675 L195 675 Q170 675 170 650 Z"
      fill="url(#box)" stroke="#54243a" stroke-width="12" stroke-linejoin="round"/>

<!-- box top -->
<path d="M170 330 L400 270 L630 330 L400 395 Z"
      fill="#ff7895" stroke="#54243a" stroke-width="12" stroke-linejoin="round"/>

<!-- lid -->
<path d="M145 260 Q145 235 170 230 L630 230 Q655 235 655 260 L655 335
         Q655 350 640 350 L160 350 Q145 350 145 335 Z"
      fill="url(#lid)" stroke="#54243a" stroke-width="12" stroke-linejoin="round"/>

<!-- lid highlight -->
<path d="M175 252 Q220 244 275 244 L605 244 Q625 244 632 257
         Q545 274 400 274 Q255 274 168 257 Z"
      fill="#ffb0c0" opacity=".55"/>

<!-- vertical ribbon -->
<path d="M356 230 L444 230 L444 675 L356 675 Z"
      fill="url(#ribbon)" stroke="#8b5a16" stroke-width="8"/>

<!-- horizontal ribbon -->
<path d="M145 300 L655 300 L655 360 L145 360 Z"
      fill="url(#ribbon)" stroke="#8b5a16" stroke-width="8"/>

<!-- bow behind knot -->
<path d="M400 255
         C355 190 265 175 230 210
         C202 238 224 286 270 287
         C318 288 363 271 400 255 Z"
      fill="url(#ribbon)" stroke="#8b5a16" stroke-width="10" stroke-linejoin="round"/>

<path d="M400 255
         C445 190 535 175 570 210
         C598 238 576 286 530 287
         C482 288 437 271 400 255 Z"
      fill="url(#ribbon)" stroke="#8b5a16" stroke-width="10" stroke-linejoin="round"/>

<!-- bow inner folds -->
<path d="M382 253 C340 220 295 215 258 226 C292 236 328 251 365 269 Z"
      fill="#ffe778" opacity=".65"/>
<path d="M418 253 C460 220 505 215 542 226 C508 236 472 251 435 269 Z"
      fill="#ffe778" opacity=".65"/>

<!-- knot -->
<ellipse cx="400" cy="258" rx="48" ry="40"
         fill="#f5b414" stroke="#8b5a16" stroke-width="10"/>

<!-- ribbon tails -->
<path d="M366 277 L294 335 L326 351 L365 325 Z"
      fill="#f5b414" stroke="#8b5a16" stroke-width="9" stroke-linejoin="round"/>
<path d="M434 277 L506 335 L474 351 L435 325 Z"
      fill="#f5b414" stroke="#8b5a16" stroke-width="9" stroke-linejoin="round"/>

<!-- simple shine -->
<path d="M198 405 L198 610" stroke="#ff9db0" stroke-width="16"
      stroke-linecap="round" opacity=".45"/>
</svg>